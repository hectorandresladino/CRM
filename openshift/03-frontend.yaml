apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: crm-frontend
  labels:
    app: crm
    component: frontend
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: crm-frontend
  labels:
    app: crm
    component: frontend
spec:
  source:
    git:
      uri: https://github.com/hectorandresladino/CRM.git
      ref: main
    contextDir: frontend
  strategy:
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: crm-frontend:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-frontend
  labels:
    app: crm
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm
      component: frontend
  template:
    metadata:
      labels:
        app: crm
        component: frontend
    spec:
      containers:
        - name: crm-frontend
          image: crm-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: crm
    component: frontend
spec:
  selector:
    app: crm
    component: frontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
