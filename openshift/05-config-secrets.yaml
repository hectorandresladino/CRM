apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  labels:
    app: crm
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_JPA_DDL: "validate"
  FLYWAY_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "crm-documents"
  ACTUATOR_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  labels:
    app: crm
type: Opaque
stringData:
  JWT_SECRET: "crm-saas-prod-super-secret-key-change-in-production-min-256-bits"
  JWT_ACCESS_EXPIRATION_MS: "900000"
  JWT_REFRESH_EXPIRATION_MS: "604800000"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "noreply@crm-saas.com"
  MAIL_PASSWORD: "change-me"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
