apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  labels:
    app: crm
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_JPA_DDL: "validate"
  FLYWAY_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "crm-documents"
  ACTUATOR_ENABLED: "true"
