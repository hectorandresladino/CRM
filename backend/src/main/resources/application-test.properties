# ============================================
# Configuracion Testing (H2 en memoria)
# ============================================

# Database - H2
spring.datasource.url=jdbc:h2:mem:crm_saas_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway - deshabilitado en test
spring.flyway.enabled=false

# JWT
app.jwt.secret=crm-saas-test-secret-key-min-256-bits-for-hs256-signing-alg
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Logging
logging.level.com.crm=WARN
logging.level.org.springframework=WARN
