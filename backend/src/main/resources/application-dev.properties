# ============================================
# Configuracion Desarrollo (H2 en memoria)
# ============================================

# Database - H2
spring.datasource.url=jdbc:h2:mem:crm_saas_dev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - deshabilitado en dev (usa ddl-auto)
spring.flyway.enabled=false

# JWT
app.jwt.secret=crm-saas-dev-secret-key-min-256-bits-for-hs256-signing-alg
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Redis - deshabilitado en dev
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Mail - deshabilitado en dev
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=

# Logging
logging.level.com.crm=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
